{% extends 'mailings/base.html' %}

{% block title %}Выход из системы{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card shadow-sm p-4">
                <h2 class="card-title text-success mb-4">Вы успешно вышли из системы! 👋</h2>
                <p class="card-text">Спасибо, что были с нами.</p>
                <p class="card-text">Вы будете автоматически перенаправлены на страницу входа через несколько секунд, или вы можете нажать на ссылку ниже.</p>
                <a href="{% url 'users:login' %}" class="btn btn-primary mt-3">Войти снова</a>
            </div>
        </div>
    </div>
</div>
