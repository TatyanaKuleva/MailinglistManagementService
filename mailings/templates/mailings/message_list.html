{% extends 'mailings/base.html' %}
{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Список сообщений</h1>
    <p class="lead">Список сообщений</p>
    <a class="btn btn-primary" href="{% url 'mailings:message_create' %}" role="button">Создать сообщение</a>
</div>
{% if messages %}
<div class="container">
    <div class="row text-center">
        {% for message in messages %}
        <div class="col-3">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h5 class="my-0 font-weight-normal product-name-area ">{{message.subject}}</h5>
                </div>
                <div class="card-body">
                    <h1 class="card-title pricing-card-title"></h1>
                    <ul class="list-unstyled mt-3 mb-5 text-start m-3">
                        <li class="mb-5"> {{message.body}}</li>
                    </ul>
                    <a class="btn btn-primary" href="{% url 'mailings:message_detail' message.pk %}" role="button">Подробнее</a>


                </div>
            </div>
        </div>
         {% endfor %}
    </div>
</div>
{% else %}
    Пока нет зарегистрированных сообщений.
{% endif %}
{% endblock %}
