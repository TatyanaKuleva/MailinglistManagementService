[tool.poetry]
name = "mailinglistmanagementservice"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
psycopg2-binary = "^2.9.11"
django = "^5.2.8"
pillow = "^12.0.0"
redis = "^7.0.1"
python-dotenv = "^1.2.1"
ipython = "^9.7.0"
black = "^25.11.0"


[tool.poetry.group.dev.dependencies]
flake8 = "^7.3.0"
isort = "^7.0.0"
black = "^25.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = '.venv'

[tool.isort]
line_length = 119

[tool.black]
line-length = 119
exclude = '''(\.git)'''